name: Update Urbex Research

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

concurrency:
  group: urbex-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Import Illinois parcels
        run: python import_east_st_louis.py

      - name: Match Illinois properties to documented evidence
        run: python create_illinois_evidence_queue.py

      - name: Build Illinois current-condition review and evidence
        run: python verify_illinois_current_conditions.py

      - name: Research Illinois current-condition evidence
        run: python research_illinois_conditions.py

      - name: Scan South City buildings
        run: python scan_south_city_buildings.py

      - name: Update Missouri and Illinois research map
        run: python build_urbex_updates.py

      - name: Commit updated data and map
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated property research and South City building scan"
            git push origin HEAD:main
          fi
