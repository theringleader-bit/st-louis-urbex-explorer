name: Refresh St Louis urbex research
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh article links and rebuild map
        run: python build_urbex_updates.py
      - name: Commit updated research and map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urbex_research_updates.json STL_Explorer_Auto_Research.html
          git diff --cached --quiet || (git commit -m "Refresh urbex research" && git push)
